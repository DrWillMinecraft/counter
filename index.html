<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Points Tool</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        #leftSide {
            flex: 1;
        }

        #scoreboard {
            width: 250px;
            border-left: 3px solid #ccc;
            padding-left: 20px;
        }

        #container {
            position: relative;
            width: 100%;
            height: 75vh;
            border: 2px solid #ccc;
            margin-top: 20px;
            overflow: hidden;
        }

        .box {
            position: absolute;
            background: #f0f0f0;
            border: 4px solid black; /* top layer border */
            border-radius: 10px;
            width: 180px;
            height: 150px;
            box-shadow: 0 0 15px currentColor;
            transition: transform 0.15s;
            cursor: pointer;
            user-select: none;
            color: black;
            z-index: 10; /* ensures border stays on top */
        }

        .box.locked {
            cursor: default;
        }

        .boxTop {
            height: 65%;
            display: flex;
            flex-direction: row;
            position: relative;
        }

        /* Middle dividing line — same color as bottom divider */
        .boxTop::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 5%;
            height: 90%;
            width: 3px;
            background: #ccc;
            z-index: 11;
        }

        .leftHalf, .rightHalf {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            opacity: 0.9;
        }

        .leftHalf:hover {
            background: rgba(0,255,0,0.15);
        }

        .rightHalf:hover {
            background: rgba(255,0,0,0.15);
        }

        .boxBottom {
            height: 35%;
            background: #e0e0e0;
            border-top: 3px solid #ccc; /* same color as middle line */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            z-index: 11;
        }

        .colorTag {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            margin-right: 10px;
            border: 3px solid #000;
        }

        #deleteMenu {
            margin: 10px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .deleteItem {
            width: 34px;
            height: 34px;
