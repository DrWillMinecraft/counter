<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Points Tool</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        #leftSide {
            flex: 1;
        }

        #scoreboard {
            width: 250px;
            border-left: 3px solid #ccc;
            padding-left: 20px;
        }

        #container {
            position: relative;
            width: 100%;
            height: 75vh;
            border: 2px solid #ccc;
            margin-top: 20px;
            overflow: hidden;
        }

        .box {
            position: absolute;
            background: #f0f0f0;
            border: 4px solid black;
            border-radius: 10px;
            width: 180px;
            height: 150px;
            box-shadow: 0 0 15px currentColor;
            transition: transform 0.15s;
            cursor: pointer;
            user-select: none;
            color: black;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .box.locked {
            cursor: default;
        }

        .colorTag {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            margin-right: 10px;
            border: 3px solid #000;
        }

        #deleteMenu {
            margin: 10px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .deleteItem {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 3px solid black;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .deleteItem:hover {
            transform: scale(1.25);
        }

        #modeIndicator {
            font-weight: bold;
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div id="leftSide">
    <h1>Points Tool</h1>

    <button onclick="addPerson()">Add Person</button>

    <h3>Delete by Color:</h3>
    <div id="deleteMenu"></div>

    <button onclick="resetPoints()">Reset All Points</button>

    <button onclick="toggleMode()">Toggle Mode</button>
    <div id="modeIndicator">Mode: POINT</div>

    <div id="container"></div>
</div>

<div id="scoreboard">
    <h2>Scoreboard</h2>
    <div id="scoreList"></div>
</div>

<script>
let boxes = [];
let usedColors = [];
let mode = "POINT"; // ⭐ NEW: point mode vs drag mode
const GRID_SIZE = 20;
const MIN_HUE_DISTANCE = 40;

/* Distinct HSL colors */
function randomColor() {
    let hue;
    let safe = false;

    while (!safe) {
        hue = Math.floor(Math.random() * 360);
        safe = true;

        for (let oldHue of usedColors) {
            if (Math.abs(hue - oldHue) < MIN_HUE_DISTANCE) {
                safe = false;
                break;
            }
        }
    }

    usedColors.push(hue);
    return `hsl(${hue}, 90%, 50%)`;
}

function toggleMode() {
    mode = mode === "POINT" ? "DRAG" : "POINT";
    document.getElementById("modeIndicator").innerText = "Mode: " + mode;
}

function addPerson() {
    const container = document.getElementById("container");
    const index = boxes.length;

    const box = document.createElement("div");
    box.className = "box";

    const color = randomColor();
    box.style.borderColor = color;

    const safeX = Math.min(20 + index * 200, container.clientWidth - 200);
    box.style.left = safeX + "px";
    box.style.top = "20px";

    box.innerText = "0";

    makeDraggable(box);
    container.appendChild(box);

    boxes.push({ element: box, points: 0, color });

    /* LEFT CLICK = add point (only in POINT mode) */
    box.addEventListener("click", (e) => {
        if (mode !== "POINT") return;
        changePoints(index, 1);
    });

    updateDeleteMenu();
    updateScoreboard();
}

/* DELETE MENU */
function updateDeleteMenu() {
    const menu = document.getElementById("deleteMenu");
    menu.innerHTML = "";

    boxes.forEach((box, i) => {
        const item = document.createElement("div");
        item.className = "deleteItem";
        item.style.background = box.color;
        item.onclick = () => deletePerson(i);
        menu.appendChild(item);
    });
}

function deletePerson(index) {
    boxes[index].element.remove();
    boxes.splice(index, 1);
    updateDeleteMenu();
    updateScoreboard();
}

/* POINTS */
function changePoints(index, amount) {
    boxes[index].points += amount;
    boxes[index].element.innerText = boxes[index].points;
    updateScoreboard();
}

function resetPoints() {
    boxes.forEach((box, i) => {
        box.points = 0;
        box.element.innerText = "0";
    });
    updateScoreboard();
}

/* SCOREBOARD */
function updateScoreboard() {
    const scoreList = document.getElementById("scoreList");
    scoreList.innerHTML = "";

    boxes.forEach((box, i) => {
        scoreList.innerHTML += `
            <div style="margin-bottom:10px; font-size:18px;">
                <span class="colorTag" style="background:${box.color};"></span>
                ${box.points} points
            </div>
        `;
    });
}

/* DRAG MODE */
function makeDraggable(el) {
    let offsetX, offsetY;

    el.addEventListener("mousedown", function(e) {
        if (mode !== "DRAG") return;

        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;

        el.isDragging = true;

        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", stop);
    });

    function move(e) {
        if (!el.isDragging) return;

        const container = document.getElementById("container");
        const rect = container.getBoundingClientRect();

        let newLeft = e.clientX - offsetX;
        let newTop = e.clientY - offsetY;

        const boxWidth = el.offsetWidth;
        const boxHeight = el.offsetHeight;

        newLeft = Math.max(0, Math.min(newLeft, rect.width - boxWidth));
        newTop = Math.max(0, Math.min(newTop, rect.height - boxHeight));

        el.style.left = newLeft + "px";
        el.style.top = newTop + "px";
        el.style.transform = "rotate(4deg)";
    }

    function stop() {
        el.isDragging = false;
        el.style.transform = "rotate(0deg)";
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", stop);
    }
}
</script>

</body>
</html>
