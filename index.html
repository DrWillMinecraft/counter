<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Points Tool</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        /* LIGHT LOADING SCREEN */
        #loadingScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            z-index: 9999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 5px solid #ccc;
            border-top-color: black;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #leftSide {
            flex: 1;
        }

        #scoreboard {
            width: 250px;
            border-left: 3px solid #ccc;
            padding-left: 20px;
        }

        #container {
            position: relative;
            width: 100%;
            height: 75vh;
            border: 2px solid #ccc;
            margin-top: 20px;
            overflow: hidden;
        }

        .box {
            position: absolute;
            background: #f0f0f0;
            border: 4px solid black;
            border-radius: 10px;
            box-shadow: 0 0 15px currentColor;
            transition: transform 0.15s, width 0.15s, height 0.15s, font-size 0.15s;
            cursor: pointer;
            user-select: none;
            color: black;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .colorTag {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            margin-right: 10px;
            border: 3px solid #000;
        }

        #deleteMenu {
            margin: 10px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .deleteItem {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 3px solid black;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .deleteItem:hover {
            transform: scale(1.25);
        }

        #modeIndicator {
            font-weight: bold;
            margin-top: 10px;
            font-size: 18px;
        }

        #sizeSlider {
            width: 200px;
        }
    </style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
    Loading... <span id="loadPercent">0%</span>
    <div class="spinner"></div>
</div>

<div id="leftSide">
    <h1>Points Tool</h1>

    <button onclick="addPerson()">Add Person</button>

    <div style="margin-top:10px;">
        <label><b>Box Size:</b></label><br>
        <input id="sizeSlider" type="range" min="1" max="100" value="50" oninput="updateSize()">
    </div>

    <button onclick="toggleMode()">Toggle Mode</button>
    <div id="modeIndicator">Mode: POINT</div>

    <h3>Delete by Color:</h3>
    <div id="deleteMenu"></div>

    <button onclick="resetPoints()">Reset All Points</button>

    <div id="container"></div>
</div>

<div id="scoreboard">
    <h2>Scoreboard</h2>
    <div id="scoreList"></div>
</div>

<script>
let boxes = [];
let usedColors = [];
let mode = "POINT";
let sizeValue = 50;

const MIN_HUE_DISTANCE = 40;
const TOTAL_BOXES = 9;

/* LOADING SCREEN UPDATE */
function setProgress(p) {
    document.getElementById("loadPercent").innerText = p + "%";
}

/* Distinct HSL colors */
function randomColor() {
    let hue;
    let safe = false;

    while (!safe) {
        hue = Math.floor(Math.random() * 360);
        safe = true;

        for (let oldHue of usedColors) {
            if (Math.abs(hue - oldHue) < MIN_HUE_DISTANCE) {
                safe = false;
                break;
            }
        }
    }

    usedColors.push(hue);
    return `hsl(${hue}, 90%, 50%)`;
}

function toggleMode() {
    mode = mode === "POINT" ? "DRAG" : "POINT";
    document.getElementById("modeIndicator").innerText = "Mode: " + mode;
}

/* UNIVERSAL SIZE SLIDER */
function updateSize() {
    sizeValue = document.getElementById("sizeSlider").value;

    const minW = 100, maxW = 260;
    const minH = 80, maxH = 220;
    const minFont = 22, maxFont = 40;

    const width = minW + (maxW - minW) * (sizeValue / 100);
    const height = minH + (maxH - minH) * (sizeValue / 100);
    const fontSize = minFont + (maxFont - minFont) * (sizeValue / 100);

    boxes.forEach(b => {
        b.element.style.width = width + "px";
        b.element.style.height = height + "px";
        b.element.style.fontSize = fontSize + "px";
    });
}

/* ADD PERSON (used for sequential loading too) */
function addPerson(positionIndex = null) {
    const container = document.getElementById("container");
    const index = boxes.length;

    const box = document.createElement("div");
    box.className = "box";

    const color = randomColor();
    box.style.borderColor = color;

    /* 3×3 ORDERED POSITIONING */
    if (positionIndex !== null) {
        const row = Math.floor(positionIndex / 3);
        const col = positionIndex % 3;

        const spacingX = 220;
        const spacingY = 180;

        box.style.left = (col * spacingX + 40) + "px";
        box.style.top = (row * spacingY + 40) + "px";
    } else {
        box.style.left = (20 + index * 40) + "px";
        box.style.top = "20px";
    }

    box.innerText = "0";

    makeDraggable(box);
    container.appendChild(box);

    boxes.push({ element: box, points: 0, color });

    box.addEventListener("click", () => {
        if (mode !== "POINT") return;
        changePoints(index, 1);
    });

    autoShrinkIfNeeded();
    updateSize();
    updateDeleteMenu();
    updateScoreboard();
}

/* AUTO SHRINK IF GRID DOESN'T FIT */
function autoShrinkIfNeeded() {
    const container = document.getElementById("container");
    const rect = container.getBoundingClientRect();

    const maxWidth = rect.width;
    const maxHeight = rect.height;

    let neededWidth = 40 + 220 * 3;
    let neededHeight = 40 + 180 * 3;

    if (neededWidth > maxWidth || neededHeight > maxHeight) {
        document.getElementById("sizeSlider").value = 20;
        updateSize();
    }
}

/* DELETE MENU */
function updateDeleteMenu() {
    const menu = document.getElementById("deleteMenu");
    menu.innerHTML = "";

    boxes.forEach((box, i) => {
        const item = document.createElement("div");
        item.className = "deleteItem";
        item.style.background = box.color;
        item.onclick = () => deletePerson(i);
        menu.appendChild(item);
    });
}

function deletePerson(index) {
    boxes[index].element.remove();
    boxes.splice(index, 1);
    updateDeleteMenu();
    updateScoreboard();
}

/* POINTS */
function changePoints(index, amount) {
    boxes[index].points += amount;
    boxes[index].element.innerText = boxes[index].points;
    updateScoreboard();
}

/* RESET */
function resetPoints() {
    boxes.forEach((box, i) => {
        box.points = 0;
        box.element.innerText = "0";
    });
    updateScoreboard();
}

/* SCOREBOARD */
function updateScoreboard() {
    const scoreList = document.getElementById("scoreList");
    scoreList.innerHTML = "";

    boxes.forEach((box, i) => {
        scoreList.innerHTML += `
            <div style="margin-bottom:10px; font-size:18px;">
                <span class="colorTag" style="background:${box.color};"></span>
                ${box.points} points
            </div>
        `;
    });
}

/* DRAG MODE */
function makeDraggable(el) {
    let offsetX, offsetY;

    el.addEventListener("mousedown", function(e) {
        if (mode !== "DRAG") return;

        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;

        el.isDragging = true;

        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", stop);
    });

    function move(e) {
        if (!el.isDragging) return;

        const container = document.getElementById("container");
        const rect = container.getBoundingClientRect();

        let newLeft = e.clientX - offsetX;
        let newTop = e.clientY - offsetY;

        const boxWidth = el.offsetWidth;
        const boxHeight = el.offsetHeight;

        newLeft = Math.max(0, Math.min(newLeft, rect.width - boxWidth));
        newTop = Math.max(0, Math.min(newTop, rect.height - boxHeight));

        el.style.left = newLeft + "px";
        el.style.top = newTop + "px";
        el.style.transform = "rotate(4deg)";
    }

    function stop() {
        el.isDragging = false;
        el.style.transform = "rotate(0deg)";
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", stop);
    }
}

/* ⭐ FREEZE‑PROOF SEQUENTIAL LOADING */
window.addEventListener("load", () => {
    setProgress(0);

    // Let browser finish layout
    requestAnimationFrame(() => {
        // Let browser finish painting
        setTimeout(() => {

            let loaded = 0;

            function loadNextBox() {
                if (loaded < TOTAL_BOXES) {
                    addPerson(loaded); // load in 3×3 order
                    loaded++;

                    const percent = Math.floor((loaded / TOTAL_BOXES) * 100);
                    setProgress(percent);

                    requestAnimationFrame(loadNextBox);
                } else {
                    document.getElementById("loadingScreen").style.display = "none";
                }
            }

            loadNextBox();

        }, 0);
    });
});
</script>

</body>
</html>
