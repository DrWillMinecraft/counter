<head>
<meta charset="UTF-8" />
<title>Point Counter</title>

<style>
  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    color:#eee;
    font-family:sans-serif;
    touch-action:none;
    overscroll-behavior:none;
  }

  body.light{
    background:#f5f5f5;
    color:#222;
  }

  /* TOP BAR — 2x size */
  #top{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:20px;
    background:#222;
    padding:0 20px;
    font-size:28px;
  }

  #top button{
    padding:20px 32px;
    border:2px solid #555;
    border-radius:8px;
    background:#333;
    color:#eee;
    cursor:pointer;
    font-size:28px;
  }

  body.light #top button{
    background:#ccc;
    color:#222;
    border-color:#888;
  }

  #sizeWrap{
    margin-right:auto;
    display:flex;
    align-items:center;
    gap:20px;
    font-size:28px;
  }

  #sizeSlider{
    width:240px;
    height:20px;
  }

  /* MAIN AREA */
  #main{
    position:relative;
    width:100%;
    height:calc(100vh - 80px);
    overflow:hidden;
  }

  /* CORNER TEMPLATE BOX */
  #corner{
    position:absolute;
    width:220px;
    height:220px;
    right:10px;
    bottom:10px;
    border:2px solid #888;
    border-radius:8px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
  }

  /* STUDENT BOX */
  .sBox{
    position:absolute;
    min-width:60px;
    min-height:40px;
    padding:6px;
    border-radius:6px;
    border:2px solid;
    background:#1c1c1c;
    color:#eee;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    user-select:none;
    cursor:pointer;
    transition:transform .15s;
  }

  /* TEMPLATE BOX */
  .tBox{
    position:absolute;
    width:60px;
    height:60px;
    padding:6px;
    border-radius:6px;
    border:2px solid;
    background:#1c1c1c;
    color:#eee;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    user-select:none;
    cursor:pointer;
  }

  /* PILL NAME INPUT */
  .nameInput{
    width:90%;
    font-size:16px;
    margin-bottom:4px;
    text-align:center;
    border:1px solid #aaa;
    border-radius:999px;
    padding:4px 10px;
    background:#fff;
    color:#000;
    outline:none;
    transition:box-shadow .2s, border-color .2s, font-size .2s;
  }

  .nameInput:hover{
    box-shadow:0 0 8px #4af;
    border-color:#4af;
  }

  /* POPUP */
  #popup{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
  }

  #popupBox{
    background:#222;
    padding:20px;
    border-radius:8px;
    width:300px;
    text-align:center;
    color:#eee;
  }

  body.light #popupBox{
    background:#fff;
    color:#222;
  }

  #popupCode{
    word-break:break-all;
    margin:10px 0;
    padding:10px;
    background:#0002;
    border-radius:6px;
  }

  #popupBox button{
    padding:10px 20px;
    margin:5px;
    border:2px solid #555;
    border-radius:6px;
    background:#333;
    color:#eee;
    cursor:pointer;
    font-size:20px;
  }

  body.light #popupBox button{
    background:#ccc;
    color:#222;
    border-color:#888;
  }
</style>
</head>
<body>

<div id="top">
  <div id="sizeWrap">
    SIZE:
    <input id="sizeSlider" type="range" min="40" max="200" value="80">
  </div>

  <button id="modeBtn">LIGHT MODE</button>
  <button id="toggle">DRAG</button>
  <button id="resetBtn">RESET</button>
  <button id="saveBtn">SAVE</button>
  <button id="loadBtn">LOAD</button>
  <button id="exportBtn">EXPORT</button>
</div>

<div id="main">
  <div id="corner"></div>
</div>

<div id="popup">
  <div id="popupBox">
    <h3>Save Code</h3>
    <div id="popupCode"></div>
    <button id="popupCopy">Copy</button>
    <button id="popupClose">Close</button>
  </div>
</div>

</body>
<script>
(function(){

  const main=document.getElementById("main");
  const corner=document.getElementById("corner");
  const toggle=document.getElementById("toggle");
  const sizeSlider=document.getElementById("sizeSlider");
  const resetBtn=document.getElementById("resetBtn");
  const saveBtn=document.getElementById("saveBtn");
  const loadBtn=document.getElementById("loadBtn");
  const modeBtn=document.getElementById("modeBtn");
  const exportBtn=document.getElementById("exportBtn");

  const popup=document.getElementById("popup");
  const popupCode=document.getElementById("popupCode");
  const popupCopy=document.getElementById("popupCopy");
  const popupClose=document.getElementById("popupClose");

  let mode="drag";
  let drag=null;
  let students=[];
  let hist=[];
  const grid=20; // GRID B

  function col(){
    return "hsl("+Math.floor(Math.random()*360)+",70%,60%)";
  }

  function applySize(el){
    const s=parseInt(sizeSlider.value,10);
    el.style.width=s+"px";
    el.style.height=s+"px";
  }

  function scaleTextWithBox(s){
    const name=s.querySelector(".student-name");
    const score=s.querySelector(".student-score");

    const boxSize=parseInt(s.style.width,10);
    let base=boxSize*0.28;

    const len=name.textContent.trim().length;
    if(len>20) base*=0.55;
    else if(len>12) base*=0.75;

    name.style.fontSize=base+"px";
    score.style.fontSize=(base*0.9)+"px";
  }

  function makeStudent(score,name){
    const s=document.createElement("div");
    s.className="sBox";
    s.style.borderColor=col();
    s.innerHTML=
      '<div class="student-name">'+(name||"")+'</div>'+
      '<div class="student-score">'+score+'</div>';
    applySize(s);
    scaleTextWithBox(s);
    return s;
  }

  function makeTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    applySize(t);
    t.innerHTML='<div class="student-name"></div><div class="student-score">0</div>';

    const start=e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      const p=e.touches?e.touches[0]:e;
      spawnTemplate();
      startDrag(t,p);
    };

    t.onmousedown=start;
    t.ontouchstart=start;

    corner.innerHTML="";
    corner.appendChild(t);
  }

  function spawnTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    applySize(t);
    t.innerHTML='<div class="student-name"></div><div class="student-score">0</div>';

    const start=e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      const p=e.touches?e.touches[0]:e;
      spawnTemplate();
      startDrag(t,p);
    };

    t.onmousedown=start;
    t.ontouchstart=start;

    corner.innerHTML="";
    corner.appendChild(t);
  }

  function startDrag(el,p){
    if(mode!=="drag")return;

    const mainRect=main.getBoundingClientRect();
    const r=el.getBoundingClientRect();

    drag={
      el,
      ox:p.clientX-r.left,
      oy:p.clientY-r.top,
      mainX:mainRect.left,
      mainY:mainRect.top
    };

    window.addEventListener("mousemove",dragMove,{passive:false});
    window.addEventListener("mouseup",dragEnd,{passive:false});
    window.addEventListener("touchmove",dragMove,{passive:false});
    window.addEventListener("touchend",dragEnd,{passive:false});
  }

  function dragMove(e){
    if(!drag)return;
    const p=e.touches?e.touches[0]:e;

    const el=drag.el;

    let x=p.clientX-drag.ox-drag.mainX;
    let y=p.clientY-drag.oy-drag.mainY;

    const w=el.offsetWidth;
    const h=el.offsetHeight;
    const mw=main.offsetWidth;
    const mh=main.offsetHeight;

    x=Math.max(0,Math.min(mw-w,x));
    y=Math.max(0,Math.min(mh-h,y));

    el.style.left=x+"px";
    el.style.top=y+"px";

    el.style.transform="rotate(3deg)";
  }

  function snap(el){
    const r=el.getBoundingClientRect();
    const m=main.getBoundingClientRect();

    let x=r.left-m.left;
    let y=r.top-m.top;

    x=Math.round(x/grid)*grid;
    y=Math.round(y/grid)*grid;

    el.style.left=x+"px";
    el.style.top=y+"px";
  }

  function dragEnd(){
    if(drag && drag.el){
      drag.el.style.transform="rotate(0deg)";
      snap(drag.el);
      scaleTextWithBox(drag.el);
    }

    drag=null;

    window.removeEventListener("mousemove",dragMove);
    window.removeEventListener("mouseup",dragEnd);
    window.removeEventListener("touchmove",dragMove);
    window.removeEventListener("touchend",dragEnd);
  }

  function enableStudent(s){
    const nameSpan=s.querySelector(".student-name");
    const scoreEl=s.querySelector(".student-score");

    const nameInput=document.createElement("input");
    nameInput.type="text";
    nameInput.placeholder="Type name…";
    nameInput.value=nameSpan.textContent;
    nameInput.className="nameInput";

    nameInput.addEventListener("input",()=>{
      nameSpan.textContent=nameInput.value.trim();
      scaleTextWithBox(s);
    });

    s.addEventListener("click",()=>{
      if(mode==="point"){
        scoreEl.textContent=parseInt(scoreEl.textContent,10)+1;
        hist.push({t:"one",s});
        scaleTextWithBox(s);
      }
      if(mode==="names"){
        students.forEach(o=>{
          const inp=o.querySelector(".nameInput");
          if(inp && o!==s) inp.style.display="none";
        });
        nameInput.style.display="block";
        nameInput.focus();
      }
    });

    s.onmousedown=e=>{
      if(mode!=="drag")return;
      const p=e.touches?e.touches[0]:e;
      startDrag(s,p);
    };

    s.ontouchstart=e=>{
      if(mode!=="drag")return;
      const p=e.touches?e.touches[0]:e;
      startDrag(s,p);
    };

    function updateNameMode(){
      if(mode==="names"){
        if(!s.contains(nameInput)) s.insertBefore(nameInput,nameSpan);
        nameSpan.style.display="none";
        nameInput.style.display="none";
      }else{
        nameSpan.style.display="block";
        if(s.contains(nameInput)) nameInput.style.display="none";
      }
    }

    updateNameMode();

    const obs=new MutationObserver(updateNameMode);
    obs.observe(toggle,{attributes:true});
  }
  function setMode(m){
    mode=m;
    toggle.textContent=m.toUpperCase();

    if(m==="drag"){
      corner.innerHTML="";
      makeTemplate();
    }

    if(m==="point"){
      corner.innerHTML="";
      const wrap=document.createElement("div");
      wrap.style.display="flex";
      wrap.style.flexDirection="column";
      wrap.style.alignItems="center";
      wrap.style.justifyContent="center";
      wrap.style.fontSize="28px";

      const plus=document.createElement("button");
      plus.textContent="ALL +1";
      plus.onclick=()=>{
        students.forEach(s=>{
          const sc=s.querySelector(".student-score");
          sc.textContent=parseInt(sc.textContent,10)+1;
          scaleTextWithBox(s);
        });
        hist.push({t:"all"});
      };

      const undo=document.createElement("button");
      undo.textContent="UNDO";
      undo.onclick=()=>{
        const last=hist.pop();
        if(!last)return;
        if(last.t==="all"){
          students.forEach(s=>{
            const sc=s.querySelector(".student-score");
            sc.textContent=parseInt(sc.textContent,10)-1;
            scaleTextWithBox(s);
          });
        }else if(last.t==="one"){
          const sc=last.s.querySelector(".student-score");
          sc.textContent=parseInt(sc.textContent,10)-1;
          scaleTextWithBox(last.s);
        }
      };

      wrap.appendChild(plus);
      wrap.appendChild(undo);
      corner.appendChild(wrap);
    }

    if(m==="names"){
      corner.innerHTML="";
      const info=document.createElement("div");
      info.style.textAlign="center";
      info.style.fontSize="24px";
      info.textContent="Click a box to edit its name.";
      corner.appendChild(info);
    }
  }

  sizeSlider.oninput=()=>{
    students.forEach(s=>{
      applySize(s);
      scaleTextWithBox(s);
    });
    const t=corner.querySelector(".tBox");
    if(t){
      applySize(t);
    }
  };

  resetBtn.onclick=()=>{
    students.forEach(s=>s.remove());
    students=[];
    hist=[];
  };

  modeBtn.onclick=()=>{
    document.body.classList.toggle("light");
    modeBtn.textContent=document.body.classList.contains("light")
      ?"DARK MODE"
      :"LIGHT MODE";
  };

  function generateCode(){
    const data={
      slider:sizeSlider.value,
      mode,
      hist:hist.map(h=>({t:h.t,index:students.indexOf(h.s)})),
      students:students.map(s=>{
        return{
          x:s.style.left,
          y:s.style.top,
          val:s.querySelector(".student-score").textContent,
          name:s.querySelector(".student-name").textContent,
          color:s.style.borderColor
        };
      })
    };

    const json=JSON.stringify(data);
    let code="PC-";
    for(let i=0;i<json.length;i++){
      code+=json.charCodeAt(i).toString(16).padStart(2,"0");
      if(i%6===5)code+="-";
    }
    return code;
  }

  saveBtn.onclick=()=>{
    popupCode.textContent=generateCode();
    popup.style.display="flex";
  };

  popupCopy.onclick=()=>{
    navigator.clipboard.writeText(popupCode.textContent);
  };

  popupClose.onclick=()=>{
    popup.style.display="none";
  };

  loadBtn.onclick=()=>{
    const code=prompt("Paste your save code:");
    if(!code)return;

    try{
      const hex=code.replace(/PC-/,"").replace(/-/g,"");
      let json="";
      for(let i=0;i<hex.length;i+=2){
        json+=String.fromCharCode(parseInt(hex.slice(i,i+2),16));
      }
      const data=JSON.parse(json);

      students.forEach(s=>s.remove());
      students=[];
      hist=[];

      sizeSlider.value=data.slider;
      setMode(data.mode);

      data.students.forEach(st=>{
        const s=makeStudent(st.val,st.name);
        s.style.borderColor=st.color;
        applySize(s);
        s.style.left=st.x;
        s.style.top=st.y;
        main.appendChild(s);
        students.push(s);
        enableStudent(s);
        scaleTextWithBox(s);
      });

      hist=[];
      data.hist.forEach(h=>{
        if(h.index>=0 && students[h.index]){
          hist.push({t:h.t,s:students[h.index]});
        }
      });

    }catch(e){
      alert("Invalid code.");
    }
  };

  exportBtn.onclick=()=>{
    const rows=students.map(s=>{
      return{
        name:s.querySelector(".student-name").textContent,
        score:parseInt(s.querySelector(".student-score").textContent,10)
      };
    });

    const alpha=rows.filter(r=>/^[A-Za-z]/.test(r.name));
    const nonAlpha=rows.filter(r=>!/^[A-Za-z]/.test(r.name));

    alpha.sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    nonAlpha.sort((a,b)=>b.score-a.score);

    const ordered=alpha.concat(nonAlpha);

    let csv="Name,Score\n";
    ordered.forEach(r=>{
      csv+='"'+r.name.replace(/"/g,'""')+'",'+r.score+"\n";
    });

    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="points.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  toggle.onclick=()=>{
    if(mode==="drag") setMode("point");
    else if(mode==="point") setMode("names");
    else setMode("drag");
  };

  // init
  setMode("drag");

})();
</script>
