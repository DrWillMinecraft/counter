<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Point Counter</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;transition:background .3s,color .3s}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#111;color:#eee;font-family:sans-serif;
  }

  /* LIGHT MODE */
  body.light{background:#f5f5f5;color:#222}
  body.light #top{background:#ddd}
  body.light #corner{background:#eee;border-color:#999}
  body.light .tBox,body.light .sBox{background:#fff;color:#222}

  #top{
    height:40px;display:flex;align-items:center;
    justify-content:flex-end;gap:10px;
    background:#222;padding:0 10px;
  }

  #toggle,#resetBtn,#saveBtn,#loadBtn,#modeBtn{
    padding:6px 12px;border:1px solid #555;border-radius:4px;
    background:#333;color:#eee;cursor:pointer;font-size:14px;
    transition:background .2s;
  }
  body.light #toggle,body.light #resetBtn,
  body.light #saveBtn,body.light #loadBtn,body.light #modeBtn{
    background:#ccc;color:#222;border-color:#888;
  }

  #toggle.drag{background:#2b5}
  #toggle.point{background:#58b}

  #sizeWrap{display:flex;align-items:center;gap:10px;font-size:14px;margin-right:auto}
  #sizeSlider{width:120px}

  #main{position:relative;width:100%;height:calc(100vh - 40px)}

  #corner{
    position:absolute;width:220px;height:220px;
    right:10px;bottom:10px;border:2px solid #888;
    border-radius:8px;background:#222;
    display:flex;align-items:center;justify-content:center;
    transition:box-shadow .15s,border-color .15s;
  }
  #corner.glow{box-shadow:0 0 15px #ff0;border-color:#ff0}

  .tBox,.sBox{
    position:absolute;min-width:60px;min-height:40px;
    padding:6px;border-radius:6px;border:2px solid;
    background:#1c1c1c;color:#eee;user-select:none;
    cursor:pointer;font-size:16px;
    opacity:0;transform:scale(.5);
    animation:popIn .25s forwards;
  }

  @keyframes popIn{
    to{opacity:1;transform:scale(1)}
  }

  .snapAnim{
    animation:snapBounce .25s;
  }

  @keyframes snapBounce{
    0%{transform:translate(0,0)}
    50%{transform:translate(0,-8px)}
    100%{transform:translate(0,0)}
  }

  .sBox.noDrag{cursor:default}

  .splitWrap{
    width:100%;height:100%;display:flex;flex-direction:row;
  }
  .half{
    flex:1;display:flex;align-items:center;justify-content:center;
    border-right:1px solid #444;cursor:pointer;font-size:14px;
  }
  .half:last-child{border-right:none}
  .half.plus{background:#264;border-radius:6px 0 0 6px}
  .half.undo{background:#642;border-radius:0 6px 6px 0}

  /* SAVE POPUP */
  #popup{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;
  }
  #popupBox{
    background:#222;padding:20px;border-radius:8px;
    width:300px;text-align:center;color:#eee;
  }
  body.light #popupBox{background:#fff;color:#222}
  #popupCode{
    word-break:break-all;margin:10px 0;padding:10px;
    background:#0002;border-radius:6px;
  }
  #popupClose,#popupCopy{
    padding:6px 12px;margin:5px;border:1px solid #555;
    border-radius:4px;background:#333;color:#eee;cursor:pointer;
  }
  body.light #popupClose,body.light #popupCopy{
    background:#ccc;color:#222;border-color:#888;
  }
</style>
</head>
<body>
<div id="top">
  <div id="sizeWrap">
    SIZE:
    <input id="sizeSlider" type="range" min="40" max="160" value="60">
  </div>

  <div id="toggle" class="drag">DRAG</div>
  <div id="resetBtn">RESET</div>
  <div id="saveBtn">SAVE</div>
  <div id="loadBtn">LOAD</div>
  <div id="modeBtn">LIGHT MODE</div>
</div>

<div id="main">
  <div id="corner"></div>
</div>

<!-- SAVE POPUP -->
<div id="popup">
  <div id="popupBox">
    <h3>Save Code</h3>
    <div id="popupCode"></div>
    <button id="popupCopy">Copy</button>
    <button id="popupClose">Close</button>
  </div>
</div>

<script>
(function(){
  const main=document.getElementById("main");
  const corner=document.getElementById("corner");
  const toggle=document.getElementById("toggle");
  const sizeSlider=document.getElementById("sizeSlider");
  const resetBtn=document.getElementById("resetBtn");
  const saveBtn=document.getElementById("saveBtn");
  const loadBtn=document.getElementById("loadBtn");
  const modeBtn=document.getElementById("modeBtn");

  const popup=document.getElementById("popup");
  const popupCode=document.getElementById("popupCode");
  const popupCopy=document.getElementById("popupCopy");
  const popupClose=document.getElementById("popupClose");

  let mode="drag";
  let drag=null;
  let students=[];
  let hist=[];
  const grid=80;

  function col(){
    return "hsl("+Math.floor(Math.random()*360)+",70%,60%)";
  }

  function applySize(el){
    const s=parseInt(sizeSlider.value,10);
    el.style.width=s+"px";
    el.style.height=s+"px";
    el.style.fontSize=Math.max(12,s/4)+"px";
  }

  function mkTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    t.textContent="0";
    applySize(t);
    corner.innerHTML="";
    corner.appendChild(t);

    t.onmousedown=e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      mkNewTemplate();
      startDrag(t,e,"template");
    };
  }

  function mkNewTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    t.textContent="0";
    applySize(t);
    corner.innerHTML="";
    corner.appendChild(t);

    t.onmousedown=e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      mkNewTemplate();
      startDrag(t,e,"template");
    };
  }

  function startDrag(el,e,type){
    const r=el.getBoundingClientRect();
    const m=main.getBoundingClientRect();

    drag={
      el,
      type,
      ox:e.clientX-r.left,
      oy:e.clientY-r.top
    };

    if(!main.contains(el)){
      const x=r.left - m.left;
      const y=r.top - m.top;
      el.style.left=x+"px";
      el.style.top=y+"px";
      main.appendChild(el);
    }

    window.addEventListener("mousemove",move);
    window.addEventListener("mouseup",end);
  }

  function move(e){
    if(!drag)return;
    const el=drag.el;
    const m=main.getBoundingClientRect();

    let x=e.clientX - m.left - drag.ox;
    let y=e.clientY - m.top - drag.oy;

    const w=el.offsetWidth, h=el.offsetHeight;
    x=Math.max(0,Math.min(m.width-w,x));
    y=Math.max(0,Math.min(m.height-h,y));

    el.style.left=x+"px";
    el.style.top=y+"px";

    const c=corner.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    const inside=r.left>=c.left && r.right<=c.right && r.top>=c.top && r.bottom<=c.bottom;
    corner.classList.toggle("glow",inside);
  }

  function snap(el){
    const m=main.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    let x=r.left-m.left;
    let y=r.top-m.top;
    x=Math.round(x/grid)*grid;
    y=Math.round(y/grid)*grid;
    el.style.left=x+"px";
    el.style.top=y+"px";
    el.classList.add("snapAnim");
    setTimeout(()=>el.classList.remove("snapAnim"),250);
  }

  function end(){
    if(!drag)return;
    const el=drag.el;
    const type=drag.type;

    window.removeEventListener("mousemove",move);
    window.removeEventListener("mouseup",end);

    const c=corner.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    const inside=r.left>=c.left && r.right<=c.right && r.top>=c.top && r.bottom<=c.bottom;

    corner.classList.remove("glow");

    if(type==="template"){
      if(inside){
        el.remove();
      }else{
        el.className="sBox";
        applySize(el);
        students.push(el);
        enableStudent(el);
        snap(el);
      }
    }else{
      if(inside){
        const i=students.indexOf(el);
        if(i>=0)students.splice(i,1);
        el.remove();
      }else{
        snap(el);
      }
    }

    drag=null;
  }

  function enableStudent(s){
    s.onclick=e=>{
      if(mode==="point"){
        s.textContent=String(parseInt(s.textContent,10)+1);
        hist.push({t:"one",s});
      }
    };
    s.onmousedown=e=>{
      if(mode!=="drag")return;
      startDrag(s,e,"student");
    };
  }

  function setMode(m){
    mode=m;

    if(m==="drag"){
      toggle.textContent="DRAG";
      toggle.classList.remove("point");
      toggle.classList.add("drag");

      corner.innerHTML="";
      mkTemplate();
      students.forEach(s=>s.classList.remove("noDrag"));

    }else{
      toggle.textContent="POINT";
      toggle.classList.remove("drag");
      toggle.classList.add("point");

      corner.innerHTML="";
      const w=document.createElement("div");
      w.className="splitWrap";

      const h1=document.createElement("div");
      h1.className="half plus";
      h1.textContent="ALL +1";

      const h2=document.createElement("div");
      h2.className="half undo";
      h2.textContent="UNDO";

      w.appendChild(h1);
      w.appendChild(h2);
      corner.appendChild(w);

      h1.onclick=()=>{
        students.forEach(s=>{
          s.textContent=String(parseInt(s.textContent,10)+1);
        });
        hist.push({t:"all"});
      };

      h2.onclick=()=>{
        const last=hist.pop();
        if(!last)return;

        if(last.t==="all"){
          students.forEach(s=>{
            s.textContent = String(parseInt(s.textContent,10) - 1);
          });
        }else if(last.t==="one"){
          last.s.textContent = String(parseInt(last.s.textContent,10) - 1);
        }
      };

      students.forEach(s=>s.classList.add("noDrag"));
    }
  }

  sizeSlider.oninput=()=>{
    students.forEach(applySize);
    const t=corner.querySelector(".tBox");
    if(t)applySize(t);
  };

  resetBtn.onclick=()=>{
    students.forEach(s=>s.remove());
    students=[];
    hist=[];
  };

  /* LIGHT / DARK MODE */
  modeBtn.onclick=()=>{
    document.body.classList.toggle("light");
    modeBtn.textContent=
      document.body.classList.contains("light")
      ? "DARK MODE"
      : "LIGHT MODE";
  };

  /* SAVE SYSTEM */
  function generateCode(){
    const data={
      slider:sizeSlider.value,
      mode,
      hist:hist.map(h=>({t:h.t,index:students.indexOf(h.s)})),
      students:students.map(s=>({
        x:s.style.left,
        y:s.style.top,
        val:s.textContent,
        color:s.style.borderColor
      }))
    };

    const json=JSON.stringify(data);
    let code="PC-";
    for(let i=0;i<json.length;i++){
      code+=json.charCodeAt(i).toString(16).padStart(2,"0");
      if(i%6===5)code+="-";
    }
    return code;
  }

  saveBtn.onclick=()=>{
    const code=generateCode();
    popupCode.textContent=code;
    popup.style.display="flex";
  };

  popupCopy.onclick=()=>{
    navigator.clipboard.writeText(popupCode.textContent);
  };

  popupClose.onclick=()=>{
    popup.style.display="none";
  };

  /* LOAD SYSTEM */
  loadBtn.onclick=()=>{
    const code=prompt("Paste your save code:");
    if(!code)return;

    try{
      const hex=code.replace(/PC-/,"").replace(/-/g,"");
      let json="";
      for(let i=0;i<hex.length;i+=2){
        json+=String.fromCharCode(parseInt(hex.slice(i,i+2),16));
      }
      const data=JSON.parse(json);

      resetBtn.onclick();

      sizeSlider.value=data.slider;
      mode=data.mode;
      setMode(mode);

      data.students.forEach(st=>{
        const s=document.createElement("div");
        s.className="sBox";
        s.style.borderColor=st.color;
        s.textContent=st.val;
        applySize(s);
        s.style.left=st.x;
        s.style.top=st.y;
        main.appendChild(s);
        students.push(s);
        enableStudent(s);
      });

      hist=[];
      data.hist.forEach(h=>{
        if(h.index>=0 && students[h.index]){
          hist.push({t:h.t,s:students[h.index]});
        }
      });

    }catch(e){
      alert("Invalid code.");
    }
  };

  toggle.onclick=()=>setMode(mode==="drag"?"point":"drag");
  setMode("drag");
})();
</script>
</body>
</html>
