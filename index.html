<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Points Tool</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        #leftSide {
            flex: 1;
        }

        #scoreboard {
            width: 250px;
            border-left: 3px solid #ccc;
            padding-left: 20px;
        }

        #container {
            position: relative;
            width: 100%;
            height: 75vh;
            border: 2px solid #ccc;
            margin-top: 20px;
            overflow: hidden;
        }

        .box {
            position: absolute;
            background: #f0f0f0;
            border: 4px solid black;
            border-radius: 10px;
            box-shadow: 0 0 15px currentColor;
            transition: transform 0.15s, width 0.2s, height 0.2s;
            cursor: pointer;
            user-select: none;
            color: black;
            z-index: 20;

            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Default size (medium) */
        .size-small { width: 120px; height: 100px; font-size: 26px; }
        .size-medium { width: 180px; height: 150px; font-size: 32px; }
        .size-large { width: 240px; height: 200px; font-size: 40px; }

        .colorTag {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            margin-right: 10px;
            border: 3px solid #000;
        }

        #deleteMenu {
            margin: 10px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .deleteItem {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: 3px solid black;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .deleteItem:hover {
            transform: scale(1.25);
        }

        #modeIndicator {
            font-weight: bold;
            margin-top: 10px;
            font-size: 18px;
        }

        #sizeBar {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        #sizeBar button {
            padding: 8px 14px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="leftSide">
    <h1>Points Tool</h1>

    <div id="sizeBar">
        <button onclick="setSize('small')">Small</button>
        <button onclick="setSize('medium')">Medium</button>
        <button onclick="setSize('large')">Large</button>
    </div>

    <button onclick="toggleMode()">Toggle Mode</button>
    <div id="modeIndicator">Mode: POINT</div>

    <h3>Delete by Color:</h3>
    <div id="deleteMenu"></div>

    <button onclick="resetPoints()">Reset All Points</button>

    <div id="container"></div>
</div>

<div id="scoreboard">
    <h2>Scoreboard</h2>
    <div id="scoreList"></div>
</div>

<script>
let boxes = [];
let usedColors = [];
let mode = "POINT";
let currentSize = "medium";

const GRID_SIZE = 20;
const MIN_HUE_DISTANCE = 40;

/* Distinct HSL colors */
function randomColor() {
    let hue;
    let safe = false;

    while (!safe) {
        hue = Math.floor(Math.random() * 360);
        safe = true;

        for (let oldHue of usedColors) {
            if (Math.abs(hue - oldHue) < MIN_HUE_DISTANCE) {
                safe = false;
                break;
            }
        }
    }

    usedColors.push(hue);
    return `hsl(${hue}, 90%, 50%)`;
}

function toggleMode() {
    mode = mode === "POINT" ? "DRAG" : "POINT";
    document.getElementById("modeIndicator").innerText = "Mode: " + mode;
}

/* ⭐ UNIVERSAL SIZE CHANGE */
function setSize(size) {
    currentSize = size;

    boxes.forEach(b => {
        b.element.classList.remove("size-small", "size-medium", "size-large");
        b.element.classList.add("size-" + size);
    });
}
