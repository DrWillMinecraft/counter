<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Point Counter</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;transition:background .3s,color .3s}
  html,body{
    width:100%;height:100%;
    overflow:hidden;
    background:#111;color:#eee;font-family:sans-serif;
    touch-action:none;
    overscroll-behavior:none;
  }

  body.light{background:#f5f5f5;color:#222}
  body.light #top{background:#ddd}
  body.light #corner{background:#eee;border-color:#999}
  body.light .tBox,body.light .sBox{background:#fff;color:#222}

  #top{
    height:40px;display:flex;align-items:center;
    justify-content:flex-end;gap:10px;
    background:#222;padding:0 10px;
  }

  #toggle,#resetBtn,#saveBtn,#loadBtn,#modeBtn,#exportBtn{
    padding:10px 16px;border:1px solid #555;border-radius:4px;
    background:#333;color:#eee;cursor:pointer;font-size:16px;
    transition:background .2s;
  }
  body.light #toggle,body.light #resetBtn,
  body.light #saveBtn,body.light #loadBtn,
  body.light #modeBtn,body.light #exportBtn{
    background:#ccc;color:#222;border-color:#888;
  }

  #toggle.drag{background:#2b5}
  #toggle.point{background:#58b}
  #toggle.names{background:#b85}

  #sizeWrap{display:flex;align-items:center;gap:10px;font-size:14px;margin-right:auto}
  #sizeSlider{width:120px}

  #main{position:relative;width:100%;height:calc(100vh - 40px)}

  #corner{
    position:absolute;width:220px;height:220px;
    right:10px;bottom:10px;border:2px solid #888;
    border-radius:8px;background:#222;
    display:flex;align-items:center;justify-content:center;
    transition:box-shadow .15s,border-color .15s;
  }
  #corner.glow{box-shadow:0 0 15px #ff0;border-color:#ff0}

  .tBox,.sBox{
    position:absolute;min-width:60px;min-height:40px;
    padding:6px;border-radius:6px;border:2px solid;
    background:#1c1c1c;color:#eee;user-select:none;
    cursor:pointer;font-size:16px;
    opacity:0;transform:scale(.9);
    animation:popIn .2s forwards;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }

  .student-name{
    font-size:12px;margin-bottom:2px;
  }
  .student-score{
    font-size:16px;
  }

  @keyframes popIn{
    to{opacity:1;transform:scale(1)}
  }

  .snapAnim{
    animation:snapSoft .15s;
  }

  @keyframes snapSoft{
    from{transform:translate(0,4px);opacity:.95}
    to{transform:translate(0,0);opacity:1}
  }

  .sBox.noDrag{cursor:default}

  .splitWrap{
    width:100%;height:100%;display:flex;flex-direction:row;
  }
  .half{
    flex:1;display:flex;align-items:center;justify-content:center;
    border-right:1px solid #444;cursor:pointer;font-size:14px;
  }
  .half:last-child{border-right:none}
  .half.plus{background:#264;border-radius:6px 0 0 6px}
  .half.undo{background:#642;border-radius:0 6px 6px 0}

  #popup{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;
  }
  #popupBox{
    background:#222;padding:20px;border-radius:8px;
    width:300px;text-align:center;color:#eee;
  }
  body.light #popupBox{background:#fff;color:#222}
  #popupCode{
    word-break:break-all;margin:10px 0;padding:10px;
    background:#0002;border-radius:6px;
  }
  #popupClose,#popupCopy{
    padding:6px 12px;margin:5px;border:1px solid #555;
    border-radius:4px;background:#333;color:#eee;cursor:pointer;
  }
  body.light #popupClose,body.light #popupCopy{
    background:#ccc;color:#222;border-color:#888;
  }
</style>
</head>
<body>
<div id="top">
  <div id="sizeWrap">
    SIZE:
    <input id="sizeSlider" type="range" min="40" max="160" value="60">
  </div>

  <div id="toggle" class="drag">DRAG</div>
  <div id="resetBtn">RESET</div>
  <div id="saveBtn">SAVE</div>
  <div id="loadBtn">LOAD</div>
  <div id="exportBtn">EXPORT</div>
  <div id="modeBtn">LIGHT MODE</div>
</div>

<div id="main">
  <div id="corner"></div>
</div>

<div id="popup">
  <div id="popupBox">
    <h3>Save Code</h3>
    <div id="popupCode"></div>
    <button id="popupCopy">Copy</button>
    <button id="popupClose">Close</button>
  </div>
</div>

<script>
(function(){
  const main=document.getElementById("main");
  const corner=document.getElementById("corner");
  const toggle=document.getElementById("toggle");
  const sizeSlider=document.getElementById("sizeSlider");
  const resetBtn=document.getElementById("resetBtn");
  const saveBtn=document.getElementById("saveBtn");
  const loadBtn=document.getElementById("loadBtn");
  const modeBtn=document.getElementById("modeBtn");
  const exportBtn=document.getElementById("exportBtn");

  const popup=document.getElementById("popup");
  const popupCode=document.getElementById("popupCode");
  const popupCopy=document.getElementById("popupCopy");
  const popupClose=document.getElementById("popupClose");

  let mode="drag"; // drag, point, names
  let drag=null;
  let students=[];
  let hist=[];
  const grid=10;

  function col(){
    return "hsl("+Math.floor(Math.random()*360)+",70%,60%)";
  }

  function applySize(el){
    const s=parseInt(sizeSlider.value,10);
    el.style.width=s+"px";
    el.style.height=s+"px";
  }

  function makeStudentContent(score,name){
    const div=document.createElement("div");
    div.className="sBox";
    div.innerHTML=
      '<div class="student-name">'+(name||'')+'</div>'+
      '<div class="student-score">'+score+'</div>';
    return div;
  }

  function mkTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    t.innerHTML=
      '<div class="student-name"></div>'+
      '<div class="student-score">0</div>';
    applySize(t);
    corner.innerHTML="";
    corner.appendChild(t);

    const start = e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      const p = e.touches ? e.touches[0] : e;
      mkNewTemplate();
      startDrag(t,p,"template");
    };

    t.onmousedown=start;
    t.ontouchstart=start;
  }

  function mkNewTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    t.innerHTML=
      '<div class="student-name"></div>'+
      '<div class="student-score">0</div>';
    applySize(t);
    corner.innerHTML="";
    corner.appendChild(t);

    const start = e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      const p = e.touches ? e.touches[0] : e;
      mkNewTemplate();
      startDrag(t,p,"template");
    };

    t.onmousedown=start;
    t.ontouchstart=start;
  }

  function startDrag(el,p,type){
    const m = main.getBoundingClientRect();
    let r = el.getBoundingClientRect();

    if (!main.contains(el)) {
      const x = r.left - m.left;
      const y = r.top - m.top;
      el.style.left = x + "px";
      el.style.top = y + "px";
      main.appendChild(el);
      r = el.getBoundingClientRect();
    }

    drag = {
      el,
      type,
      ox: p.clientX - r.left,
      oy: p.clientY - r.top
    };

    const moveHandler = ev=>{
      ev.preventDefault();
      const pt = ev.touches ? ev.touches[0] : ev;
      move(pt);
    };
    const endHandler = ev=>{
      ev.preventDefault();
      end();
      window.removeEventListener("mousemove",moveHandler);
      window.removeEventListener("mouseup",endHandler);
      window.removeEventListener("touchmove",moveHandler);
      window.removeEventListener("touchend",endHandler);
    };

    window.addEventListener("mousemove",moveHandler,{passive:false});
    window.addEventListener("mouseup",endHandler,{passive:false});
    window.addEventListener("touchmove",moveHandler,{passive:false});
    window.addEventListener("touchend",endHandler,{passive:false});
  }

  function move(p){
    if(!drag)return;
    const el=drag.el;
    const m=main.getBoundingClientRect();

    let x=p.clientX - m.left - drag.ox;
    let y=p.clientY - m.top - drag.oy;

    const w=el.offsetWidth, h=el.offsetHeight;
    x=Math.max(0,Math.min(m.width-w,x));
    y=Math.max(0,Math.min(m.height-h,y));

    el.style.left=x+"px";
    el.style.top=y+"px";

    const c=corner.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    const inside=r.left>=c.left && r.right<=c.right && r.top>=c.top && r.bottom<=c.bottom;
    corner.classList.toggle("glow",inside);
  }

  function snap(el){
    const m=main.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    let x=r.left-m.left;
    let y=r.top-m.top;
    x=Math.round(x/grid)*grid;
    y=Math.round(y/grid)*grid;
    el.style.left=x+"px";
    el.style.top=y+"px";
    el.classList.add("snapAnim");
    setTimeout(()=>el.classList.remove("snapAnim"),150);
  }

  function end(){
    if(!drag)return;
    const el=drag.el;
    const type=drag.type;

    const c=corner.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    const inside=r.left>=c.left && r.right<=c.right && r.top>=c.top && r.bottom<=c.bottom;

    corner.classList.remove("glow");

    if(type==="template"){
      if(inside){
        el.remove();
      }else{
        const s=makeStudentContent(
          el.querySelector(".student-score").textContent,
          el.querySelector(".student-name").textContent
        );
        s.style.borderColor=el.style.borderColor;
        applySize(s);
        s.style.left=el.style.left;
        s.style.top=el.style.top;
        main.appendChild(s);
        students.push(s);
        enableStudent(s);
        el.remove();
        snap(s);
      }
    }else{
      if(inside){
        const i=students.indexOf(el);
        if(i>=0)students.splice(i,1);
        el.remove();
      }else{
        snap(el);
      }
    }

    drag=null;
  }

  function enableStudent(s){
    const scoreEl = ()=>s.querySelector(".student-score");
    const nameEl = ()=>s.querySelector(".student-name");

    s.onclick=e=>{
      if(mode==="point"){
        const sc = scoreEl();
        sc.textContent = String(parseInt(sc.textContent,10)+1);
        hist.push({t:"one",s});
      }else if(mode==="names"){
        const current = nameEl().textContent || "";
        const nm = prompt("Enter name:", current);
        if(nm!==null){
          nameEl().textContent = nm.trim();
        }
      }
    };

    const start = e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      const p = e.touches ? e.touches[0] : e;
      startDrag(s,p,"student");
    };

    s.onmousedown=start;
    s.ontouchstart=start;
  }

  function setMode(m){
    mode=m;
    toggle.classList.remove("drag","point","names");

    if(m==="drag"){
      toggle.textContent="DRAG";
      toggle.classList.add("drag");

      corner.innerHTML="";
      mkTemplate();
      students.forEach(s=>s.classList.remove("noDrag"));

    }else if(m==="point"){
      toggle.textContent="POINT";
      toggle.classList.add("point");

      corner.innerHTML="";
      const w=document.createElement("div");
      w.className="splitWrap";

      const h1=document.createElement("div");
      h1.className="half plus";
      h1.textContent="ALL +1";

      const h2=document.createElement("div");
      h2.className="half undo";
      h2.textContent="UNDO";

      w.appendChild(h1);
      w.appendChild(h2);
      corner.appendChild(w);

      h1.onclick=()=>{
        students.forEach(s=>{
          const sc = s.querySelector(".student-score");
          sc.textContent=String(parseInt(sc.textContent,10)+1);
        });
        hist.push({t:"all"});
      };

      h2.onclick=()=>{
        const last=hist.pop();
        if(!last)return;

        if(last.t==="all"){
          students.forEach(s=>{
            const sc = s.querySelector(".student-score");
            sc.textContent = String(parseInt(sc.textContent,10) - 1);
          });
        }else if(last.t==="one"){
          const sc = last.s.querySelector(".student-score");
          sc.textContent = String(parseInt(sc.textContent,10) - 1);
        }
      };

      students.forEach(s=>s.classList.add("noDrag"));

    }else if(m==="names"){
      toggle.textContent="NAMES";
      toggle.classList.add("names");

      corner.innerHTML="";
      const info=document.createElement("div");
      info.style.textAlign="center";
      info.innerHTML="Tap a box to set its name.<br/>Names show above the score.";
      corner.appendChild(info);

      students.forEach(s=>s.classList.add("noDrag"));
    }
  }

  sizeSlider.oninput=()=>{
    students.forEach(applySize);
    const t=corner.querySelector(".tBox");
    if(t)applySize(t);
  };

  resetBtn.onclick=()=>{
    students.forEach(s=>s.remove());
    students=[];
    hist=[];
  };

  modeBtn.onclick=()=>{
    document.body.classList.toggle("light");
    modeBtn.textContent=
      document.body.classList.contains("light")
      ? "DARK MODE"
      : "LIGHT MODE";
  };

  function generateCode(){
    const data={
      slider:sizeSlider.value,
      mode,
      hist:hist.map(h=>({t:h.t,index:students.indexOf(h.s)})),
      students:students.map(s=>{
        const name = s.querySelector(".student-name").textContent;
        const val = s.querySelector(".student-score").textContent;
        return {
          x:s.style.left,
          y:s.style.top,
          val,
          name,
          color:s.style.borderColor
        };
      })
    };

    const json=JSON.stringify(data);
    let code="PC-";
    for(let i=0;i<json.length;i++){
      code+=json.charCodeAt(i).toString(16).padStart(2,"0");
      if(i%6===5)code+="-";
    }
    return code;
  }

  saveBtn.onclick=()=>{
    const code=generateCode();
    popupCode.textContent=code;
    popup.style.display="flex";
  };

  popupCopy.onclick=()=>{
    navigator.clipboard.writeText(popupCode.textContent);
  };

  popupClose.onclick=()=>{
    popup.style.display="none";
  };

  loadBtn.onclick=()=>{
    const code=prompt("Paste your save code:");
    if(!code)return;

    try{
      const hex=code.replace(/PC-/,"").replace(/-/g,"");
      let json="";
      for(let i=0;i<hex.length;i+=2){
        json+=String.fromCharCode(parseInt(hex.slice(i,i+2),16));
      }
      const data=JSON.parse(json);

      resetBtn.onclick();

      sizeSlider.value=data.slider;
      mode=data.mode;
      setMode(mode);

      data.students.forEach(st=>{
        const s=makeStudentContent(st.val, st.name);
        s.style.borderColor=st.color;
        applySize(s);
        s.style.left=st.x;
        s.style.top=st.y;
        main.appendChild(s);
        students.push(s);
        enableStudent(s);
      });

      hist=[];
      data.hist.forEach(h=>{
        if(h.index>=0 && students[h.index]){
          hist.push({t:h.t,s:students[h.index]});
        }
      });

    }catch(e){
      alert("Invalid code.");
    }
  };

  // EXPORT TO EXCEL-COMPATIBLE CSV
  exportBtn.onclick=()=>{
    const rows = students.map(s=>{
      const name = s.querySelector(".student-name").textContent || "";
      const score = parseInt(s.querySelector(".student-score").textContent,10) || 0;
      return {name,score};
    });

    const alpha = rows.filter(r=>/^[A-Za-z]/.test(r.name));
    const nonAlpha = rows.filter(r=>!/^[A-Za-z]/.test(r.name));

    alpha.sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    nonAlpha.sort((a,b)=>b.score - a.score);

    const ordered = alpha.concat(nonAlpha);

    let csv = "Name,Score\n";
    ordered.forEach(r=>{
      csv += `"${r.name.replace(/"/g,'""')}",${r.score}\n`;
    });

    const blob = new Blob([csv],{type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "points.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  toggle.onclick=()=>{
    if(mode==="drag") setMode("point");
    else if(mode==="point") setMode("names");
    else setMode("drag");
  };

  setMode("drag");
})();
</script>
</body>
</html>
