<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Points Counter</title>

<style>
/* --------------------------------------------------
   Professional Neutral Theme — Clean, Calm, Modern
-------------------------------------------------- */

:root {
    --bg: #f4f4f6;
    --bg-dark: #1e1f22;

    --text: #222;
    --text-dark: #e6e6e6;

    --panel: #ffffff;
    --panel-dark: #2a2b2f;

    --border: #d0d0d0;
    --border-dark: #3a3b40;

    --primary: #4a6ee0;
    --primary-dark: #6f8aff;

    --danger: #d9534f;
    --danger-dark: #ff6b66;

    --neutral: #6c757d;
    --neutral-dark: #9aa0a6;

    --shadow: rgba(0,0,0,0.08);
    --shadow-dark: rgba(0,0,0,0.4);
}

body {
    margin: 0;
    font-family: "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s, color 0.25s;
}

body.dark {
    background: var(--bg-dark);
    color: var(--text-dark);
}

/* Top Bar */
#topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 4px var(--shadow);
}
body.dark #topbar {
    background: var(--panel-dark);
    border-bottom-color: var(--border-dark);
    box-shadow: 0 2px 4px var(--shadow-dark);
}

.top-left, .top-center, .top-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    cursor: pointer;
    border: none;
    padding: 8px 14px;
    font-size: 15px;
    border-radius: 6px;
    transition: background 0.2s, transform 0.1s;
}
button:active {
    transform: scale(0.97);
}

.primary-btn { background: var(--primary); color: white; }
body.dark .primary-btn { background: var(--primary-dark); }

.neutral-btn { background: var(--neutral); color: white; }
body.dark .neutral-btn { background: var(--neutral-dark); }

.danger-btn { background: var(--danger); color: white; }
body.dark .danger-btn { background: var(--danger-dark); }

/* Settings Menu */
#settingsMenu {
    position: absolute;
    right: 16px;
    top: 60px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 3px 8px var(--shadow);
    border-radius: 6px;
    padding: 8px 0;
    display: none;
    flex-direction: column;
    width: 160px;
    z-index: 20;
}
body.dark #settingsMenu {
    background: var(--panel-dark);
    border-color: var(--border-dark);
    box-shadow: 0 3px 8px var(--shadow-dark);
}

.dropdown-btn {
    background: none;
    border: none;
    padding: 10px 14px;
    text-align: left;
    width: 100%;
    font-size: 14px;
}
.dropdown-btn:hover {
    background: rgba(0,0,0,0.06);
}
body.dark .dropdown-btn:hover {
    background: rgba(255,255,255,0.08);
}

/* Workspace */
#workspace {
    position: relative;
    width: 100%;
    height: calc(100vh - 60px);
    overflow: hidden;
}

.spawn-box {
    position: absolute;
    right: 16px;
    top: 16px;
    width: 140px;
    height: 140px;
    background: var(--panel);
    border: 2px dashed var(--border);
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--neutral);
    font-size: 14px;
    box-shadow: 0 2px 4px var(--shadow);
}
body.dark .spawn-box {
    background: var(--panel-dark);
    border-color: var(--border-dark);
    box-shadow: 0 2px 4px var(--shadow-dark);
}

/* Student Boxes */
.student {
    position: absolute;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    width: 120px;
    height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 2px 4px var(--shadow);
}
body.dark .student {
    background: var(--panel-dark);
    border-color: var(--border-dark);
    box-shadow: 0 2px 4px var(--shadow-dark);
}

.student-name {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
    text-align: center;
}

.student-score {
    font-size: 32px;
    font-weight: bold;
}

.nameInput {
    display: none;
    width: 90%;
    padding: 6px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    text-align: center;
}
body.dark .nameInput {
    background: var(--panel-dark);
    color: var(--text-dark);
    border-color: var(--border-dark);
}

/* Popup */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 50;
}
.modal-content {
    background: var(--panel);
    padding: 20px;
    border-radius: 8px;
    width: 320px;
    box-shadow: 0 3px 8px var(--shadow);
}
body.dark .modal-content {
    background: var(--panel-dark);
    box-shadow: 0 3px 8px var(--shadow-dark);
}

#popupCode {
    width: 100%;
    height: 120px;
    margin-top: 10px;
    padding: 10px;
    resize: none;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-family: monospace;
}
body.dark #popupCode {
    background: var(--panel-dark);
    color: var(--text-dark);
    border-color: var(--border-dark);
}

.modal-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
}
</style>
</head>

<body>

<header id="topbar">
    <div class="top-left">
        <label for="sizeSlider">Size:</label>
        <input id="sizeSlider" type="range" min="60" max="180" value="120">
    </div>

    <div class="top-center">
        <button id="modeToggle" class="primary-btn">DRAG</button>
    </div>

    <div class="top-right">
        <button id="resetBtn" class="danger-btn">Reset</button>
        <button id="settingsBtn" class="neutral-btn">Settings</button>
    </div>
</header>

<div id="settingsMenu">
    <button id="themeToggle" class="dropdown-btn">Light / Dark</button>
    <button id="saveBtn" class="dropdown-btn">Save</button>
    <button id="loadBtn" class="dropdown-btn">Load</button>
    <button id="exportBtn" class="dropdown-btn">Export CSV</button>
</div>

<main id="workspace">
    <div id="spawnArea" class="spawn-box">Spawn</div>
</main>

<div id="popup" class="modal">
    <div class="modal-content">
        <h3 id="popupTitle"></h3>
        <textarea id="popupCode" readonly></textarea>
        <div class="modal-actions">
            <button id="popupCopy" class="primary-btn">Copy</button>
            <button id="popupClose" class="neutral-btn">Close</button>
        </div>
    </div>
</div>

<script>
(() => {

    const workspace = document.getElementById("workspace");
    const spawnArea = document.getElementById("spawnArea");

    const modeToggle = document.getElementById("modeToggle");
    const resetBtn = document.getElementById("resetBtn");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsMenu = document.getElementById("settingsMenu");

    const themeToggle = document.getElementById("themeToggle");
    const saveBtn = document.getElementById("saveBtn");
    const loadBtn = document.getElementById("loadBtn");
    const exportBtn = document.getElementById("exportBtn");

    const popup = document.getElementById("popup");
    const popupTitle = document.getElementById("popupTitle");
    const popupCode = document.getElementById("popupCode");
    const popupCopy = document.getElementById("popupCopy");
    const popupClose = document.getElementById("popupClose");

    const sizeSlider = document.getElementById("sizeSlider");

    let students = [];
    let mode = "drag";
    let darkMode = false;

    function createStudent(x, y) {
        const box = document.createElement("div");
        box.className = "student";
        box.style.left = x + "px";
        box.style.top = y + "px";

        const name = document.createElement("div");
        name.className = "student-name";
        name.textContent = "Name";

        const score = document.createElement("div");
        score.className = "student-score";
        score.textContent = "0";

        const input = document.createElement("input");
        input.className = "nameInput";
        input.placeholder = "Enter name";

        box.appendChild(name);
        box.appendChild(score);
        box.appendChild(input);

        workspace.appendChild(box);

        const student = {
            el: box,
            nameEl: name,
            scoreEl: score,
            inputEl: input,
            score: 0,
            dragging: false,
            offsetX: 0,
            offsetY: 0
        };

        setupStudentEvents(student);
        students.push(student);
    }

    function setupStudentEvents(s) {

        s.el.addEventListener("mousedown", e => {
            if (mode === "drag") {
                s.dragging = true;
                s.offsetX = e.clientX - s.el.offsetLeft;
                s.offsetY = e.clientY - s.el.offsetTop;
            }
        });

        document.addEventListener("mousemove", e => {
            if (s.dragging) {
                s.el.style.left = (e.clientX - s.offsetX) + "px";
                s.el.style.top = (e.clientY - s.offsetY) + "px";
            }
        });

        document.addEventListener("mouseup", () => {
            s.dragging = false;
        });

        s.el.addEventListener("click", () => {
            if (mode === "point") {
                s.score++;
                s.scoreEl.textContent = s.score;
            }
            if (mode === "names") {
                s.nameEl.style.display = "none";
                s.inputEl.style.display = "block";
                s.inputEl.value = s.nameEl.textContent;
                s.inputEl.focus();
            }
        });

        s.inputEl.addEventListener("blur", () => {
            s.nameEl.textContent = s.inputEl.value || "Name";
            s.inputEl.style.display = "none";
            s.nameEl.style.display = "block";
        });
    }

    spawnArea.addEventListener("click", () => {
        const rect = spawnArea.getBoundingClientRect();
        createStudent(rect.left + 10, rect.top + 10);
    });

    modeToggle.addEventListener("click", () => {
        if (mode === "drag") {
            mode = "point";
            modeToggle.textContent = "POINT";
        } else if (mode === "point") {
            mode = "names";
            modeToggle.textContent = "NAMES";
        } else {
            mode = "drag";
            modeToggle.textContent = "DRAG";
        }
    });

    resetBtn.addEventListener("click", () => {
        students.forEach(s => s.el.remove());
        students = [];
    });

    settingsBtn.addEventListener("click", () => {
        settingsMenu.style.display =
            settingsMenu.style.display === "flex" ? "none" : "flex";
    });

    themeToggle.addEventListener("click", () => {
        darkMode = !darkMode;
        document.body.classList.toggle("dark", darkMode);
    });

    saveBtn.addEventListener("click", () => {
        const data = students.map(s => ({
            name: s.nameEl.textContent,
            score: s.score,
            x: s.el.offsetLeft,
            y: s.el.offsetTop
        }));
        localStorage.setItem("pointsData", JSON.stringify(data));
    });

    loadBtn.addEventListener("click", () => {
        const raw = localStorage.getItem("pointsData");
        if (!raw) return;

        students.forEach(s => s.el.remove());
        students = [];

        const data = JSON.parse(raw);
        data.forEach(d => {
            createStudent(d.x, d.y);
            const s = students[students.length - 1];
            s.nameEl.textContent = d.name;
            s.score = d.score;
            s.scoreEl.textContent = d.score;
        });
    });

    exportBtn.addEventListener("click", () => {
        let csv = "Name,Score\n";
        students.forEach(s => {
            csv += `${s.nameEl.textContent},${s.score}\n`;
        });

        popupTitle.textContent = "Export CSV";
        popupCode.value = csv;
        popup.style.display = "flex";
    });

    popupCopy.addEventListener("click", () => {
        popupCode.select();
        document.execCommand("copy");
    });

    popupClose.addEventListener("click", () => {
        popup.style.display = "none";
    });

    sizeSlider.addEventListener("input", () => {
        const size = sizeSlider.value + "px";
        students.forEach(s => {
            s.el.style.width = size;
            s.el.style.height = size;
        });
    });

})();
</script>

</body>
</html>
