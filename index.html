<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:sans-serif}
  #top{height:40px;display:flex;align-items:center;justify-content:center;background:#222}
  #toggle{padding:6px 12px;border:1px solid #555;border-radius:4px;background:#333;color:#eee;cursor:pointer;font-size:14px}
  #toggle.drag{background:#2b5}
  #toggle.point{background:#58b}
  #main{position:relative;width:100%;height:calc(100vh - 40px)}
  #corner{
    position:absolute;
    width:120px;
    height:120px;
    right:10px;
    bottom:10px;
    border:2px solid #888;
    border-radius:8px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:box-shadow .15s,border-color .15s;
  }
  #corner.glow{box-shadow:0 0 15px #ff0;border-color:#ff0}
  .tBox,.sBox{
    position:absolute;
    min-width:60px;
    min-height:40px;
    padding:6px;
    border-radius:6px;
    border:2px solid;
    background:#1c1c1c;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#eee;
    user-select:none;
    cursor:pointer;
    font-size:16px;
  }
  .sBox.noDrag{cursor:default}
  .splitWrap{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:row;
  }
  .half{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:1px solid #444;
    cursor:pointer;
  }
  .half:last-child{border-right:none}
  .half.plus{background:#264;border-radius:6px 0 0 6px;color:#eee;font-size:12px}
  .half.undo{background:#642;border-radius:0 6px 6px 0;position:relative}
  .arrowWrap{
    width:60%;
    height:60%;
    position:relative;
  }
  .barDiag,.barHoriz,.barVert,.head{
    position:absolute;
    background:#eee;
  }
  .barDiag{
    width:70%;
    height:6px;
    left:10%;
    top:40%;
    transform:rotate(45deg);
    transform-origin:center;
  }
  .barHoriz{
    width:50%;
    height:6px;
    left:25%;
    top:65%;
  }
  .barVert{
    width:6px;
    height:40%;
    left:20%;
    top:35%;
  }
  .head{
    width:12px;
    height:12px;
    right:10%;
    top:30%;
    transform:rotate(45deg);
  }
</style>
</head>
<body>
<div id="top">
  <div id="toggle" class="drag">DRAG</div>
</div>
<div id="main">
  <div id="corner"></div>
</div>

<script>
(function(){
  const main=document.getElementById("main");
  const corner=document.getElementById("corner");
  const toggle=document.getElementById("toggle");

  let mode="drag";
  let drag=null;
  let students=[];
  let hist=[];

  function col(){
    return "hsl("+Math.floor(Math.random()*360)+",70%,60%)";
  }

  function mkTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    t.textContent="0";
    corner.innerHTML="";
    corner.appendChild(t);
    t.onmousedown=e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      mkNewTemplate();
      startDrag(t,e,"template");
    };
  }

  function mkNewTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    t.textContent="0";
    corner.innerHTML="";
    corner.appendChild(t);
    t.onmousedown=e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      mkNewTemplate();
      startDrag(t,e,"template");
    };
  }

  function startDrag(el,e,type){
    const r=el.getBoundingClientRect();
    drag={el,type,ox:e.clientX-r.left,oy:e.clientY-r.top};
    el.style.position="absolute";
    main.appendChild(el);
    move(e);
    window.addEventListener("mousemove",move);
    window.addEventListener("mouseup",end);
  }

  function move(e){
    if(!drag)return;
    const el=drag.el;
    const m=main.getBoundingClientRect();
    let x=e.clientX-m.left-drag.ox;
    let y=e.clientY-m.top-drag.oy;
    const w=el.offsetWidth,h=el.offsetHeight;
    x=Math.max(0,Math.min(m.width-w,x));
    y=Math.max(0,Math.min(m.height-h,y));
    el.style.left=x+"px";
    el.style.top=y+"px";

    const c=corner.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    const inside=r.left>=c.left&&r.right<=c.right&&r.top>=c.top&&r.bottom<=c.bottom;
    corner.classList.toggle("glow",inside);
  }

  function end(){
    if(!drag)return;
    const el=drag.el;
    const type=drag.type;
    window.removeEventListener("mousemove",move);
    window.removeEventListener("mouseup",end);

    const c=corner.getBoundingClientRect();
    const r=el.getBoundingClientRect();
    const inside=r.left>=c.left&&r.right<=c.right&&r.top>=c.top&&r.bottom<=c.bottom;
    corner.classList.remove("glow");

    if(type==="template"){
      if(inside){
        el.remove();
      }else{
        el.className="sBox";
        students.push(el);
        enableStudent(el);
      }
    }else{
      if(inside){
        const i=students.indexOf(el);
        if(i>=0)students.splice(i,1);
        el.remove();
      }
    }
    drag=null;
  }

  function enableStudent(s){
    s.onclick=e=>{
      if(mode==="point"){
        s.textContent=String(parseInt(s.textContent,10)+1);
        hist.push({t:"one",s});
      }
    };
    s.onmousedown=e=>{
      if(mode!=="drag")return;
      startDrag(s,e,"student");
    };
  }

  function setMode(m){
    mode=m;
    if(m==="drag"){
      toggle.textContent="DRAG";
      toggle.classList.remove("point");
      toggle.classList.add("drag");
      corner.innerHTML="";
      mkTemplate();
      students.forEach(s=>s.classList.remove("noDrag"));
    }else{
      toggle.textContent="POINT";
      toggle.classList.remove("drag");
      toggle.classList.add("point");
      corner.innerHTML="";
      const w=document.createElement("div");
      w.className="splitWrap";
      const h1=document.createElement("div");
      h1.className="half plus";
      h1.textContent="ALL +1";
      const h2=document.createElement("div");
      h2.className="half undo";
      const aw=document.createElement("div");
      aw.className="arrowWrap";
      const bd=document.createElement("div");
      bd.className="barDiag";
      const bh=document.createElement("div");
      bh.className="barHoriz";
      const bv=document.createElement("div");
      bv.className="barVert";
      const hd=document.createElement("div");
      hd.className="head";
      aw.appendChild(bd);
      aw.appendChild(bh);
      aw.appendChild(bv);
      aw.appendChild(hd);
      h2.appendChild(aw);
      w.appendChild(h1);
      w.appendChild(h2);
      corner.appendChild(w);

      h1.onclick=()=>{
        students.forEach(s=>{
          s.textContent=String(parseInt(s.textContent,10)+1);
        });
        hist.push({t:"all"});
      };
      h2.onclick=()=>{
        const last=hist.pop();
        if(!last)return;
        if(last.t==="all"){
          students.forEach(s=>{
            s.textContent=String(parseInt(s.textContent,10)-1);
          });
        }else if(last.t==="one"){
          last.s.textContent=String(parseInt(last.s.textContent,10)-1);
        }
      };

      students.forEach(s=>s.classList.add("noDrag"));
    }
  }

  toggle.onclick=()=>setMode(mode==="drag"?"point":"drag");
  setMode("drag");
})();
</script>
</body>
</html>
