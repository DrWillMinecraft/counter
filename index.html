<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Points</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #222;
  color: white;
  user-select: none;
}

/* LIGHT MODE */
body.light {
  background: #f2f2f2;
  color: #000;
}
body.light #topbar { background: #ddd; }
body.light #settingsMenu { background: #eee; }
body.light #spawn { background: #fafafa; border-color: #ccc; }
body.light .sBox, body.light .tBox {
  background: #fff;
  border-color: #000;
  color: #000;
}
body.light .pointSplit button {
  background: #ccc;
  color: #000;
}
body.light #popupBox {
  background: #fff;
  color: #000;
}

/* TOP BAR */
#topbar {
  height: 60px;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
}

/* LEFT: Size slider */
#leftBar {
  display: flex;
  align-items: center;
}
#sizeLabel {
  margin-right: 10px;
  font-size: 16px;
}
#sizeSlider {
  width: 160px;
}

/* CENTER: Mode toggle */
#centerBar {
  display: flex;
  flex: 1;
  justify-content: center;
}
#toggle {
  padding: 10px 20px;
  background: #5566ff;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

/* RIGHT: Reset + Settings */
#rightBar {
  display: flex;
  align-items: center;
  gap: 10px;
}
#resetBtn {
  padding: 10px 20px;
  background: #aa3333;
  border-radius: 6px;
  cursor: pointer;
}
#settingsBtn {
  padding: 10px 20px;
  background: #444;
  border-radius: 6px;
  cursor: pointer;
}

/* Settings menu */
#settingsMenu {
  position: absolute;
  top: 60px;
  right: 10px;
  background: #333;
  padding: 10px;
  border-radius: 6px;
  display: none;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
  pointer-events: auto;
}

/* Main area */
#main {
  position: relative;
  width: 100vw;
  height: calc(100vh - 60px);
  overflow: hidden;
}

/* Spawn box */
#spawn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  width: 220px;
  height: 220px;
  background: #111;
  border: 3px solid #444;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}

#spawn.deleting {
  background: #333;
  border-color: #777;
}

#spawn.flash {
  background: #555;
  border-color: #aaa;
}

/* Student + Template boxes */
.sBox, .tBox {
  position: absolute;
  background: #111;
  border: 4px solid white;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
}

.student-name {
  font-weight: bold;
}

.student-score {
  margin-top: 5px;
}

/* Name input */
.nameInput {
  position: absolute;
  top: 5px;
  left: 5px;
  width: calc(100% - 10px);
  border-radius: 6px;
  border: none;
  padding: 5px;
  font-size: 16px;
  display: none;
}

/* Popup */
#popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

#popup[style*="display: flex"] {
  pointer-events: auto;
}

#popupBox {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  width: 300px;
}

#popupCode {
  width: 100%;
  height: 120px;
}

/* Point mode buttons */
.pointSplit {
  display: flex;
  flex-direction: row;
  width: 100%;
  height: 100%;
}

.pointSplit button {
  flex: 1;
  height: 100%;
  font-size: 22px;
  background: #555;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div id="topbar">

  <!-- LEFT -->
  <div id="leftBar">
    <label id="sizeLabel">Size:</label>
    <input id="sizeSlider" type="range" min="60" max="180" value="120">
  </div>

  <!-- CENTER -->
  <div id="centerBar">
    <div id="toggle">DRAG</div>
  </div>

  <!-- RIGHT -->
  <div id="rightBar">
    <div id="resetBtn">RESET</div>
    <div id="settingsBtn">⚙️</div>
  </div>

</div>

<!-- SETTINGS MENU -->
<div id="settingsMenu">
  <button id="setLightDark">Light/Dark</button>
  <button id="setSave">Save</button>
  <button id="setLoad">Load</button>
  <button id="setExport">Export CSV</button>
</div>

<!-- MAIN AREA -->
<div id="main">
  <div id="spawn"></div>
</div>

<!-- POPUP -->
<div id="popup">
  <div id="popupBox">
    <h3 id="popupTitle"></h3>
    <textarea id="popupCode"></textarea>
    <button id="popupCopy">Copy</button>
    <button id="popupClose">Close</button>
  </div>
</div>

<script>
</body>
</html>
(function(){

  const main=document.getElementById("main");
  const spawn=document.getElementById("spawn");
  const toggle=document.getElementById("toggle");
  const sizeSlider=document.getElementById("sizeSlider");
  const resetBtn=document.getElementById("resetBtn");

  const settingsBtn=document.getElementById("settingsBtn");
  const settingsMenu=document.getElementById("settingsMenu");

  const popup=document.getElementById("popup");
  const popupTitle=document.getElementById("popupTitle");
  const popupCode=document.getElementById("popupCode");
  const popupCopy=document.getElementById("popupCopy");
  const popupClose=document.getElementById("popupClose");

  let mode="drag";
  let drag=null;
  let students=[];
  let hist=[];
  const grid=20;

  function col(){
    return "hsl("+Math.floor(Math.random()*360)+",70%,60%)";
  }

  function applySize(el){
    let s = parseInt(sizeSlider.value,10);
    el.style.width = s + "px";
    el.style.height = s + "px";

    const nameInput = el.querySelector(".nameInput");
    if(nameInput){
      nameInput.style.fontSize = (s * 0.18) + "px";
      nameInput.style.padding = (s * 0.05) + "px";
    }
  }

  function clampToMain(el){
    const mw = main.offsetWidth;
    const mh = main.offsetHeight;
    const w = el.offsetWidth;
    const h = el.offsetHeight;

    let x = parseInt(el.style.left,10);
    let y = parseInt(el.style.top,10);

    if(x < 0) x = 0;
    if(y < 0) y = 0;
    if(x > mw - w) x = mw - w;
    if(y > mh - h) y = mh - h;

    el.style.left = x + "px";
    el.style.top = y + "px";
  }

  function scaleTextWithBox(s){
    const name=s.querySelector(".student-name");
    const score=s.querySelector(".student-score");

    const boxSize=parseInt(s.style.width,10);
    let base=boxSize*0.28;

    const len=name.textContent.trim().length;
    if(len>20) base*=0.55;
    else if(len>12) base*=0.75;

    name.style.fontSize=base+"px";
    score.style.fontSize=(base*0.9)+"px";
  }

  function makeStudent(score,name){
    const s=document.createElement("div");
    s.className="sBox";
    s.style.borderColor=col();
    s.innerHTML=
      '<div class="student-name">'+(name||"")+'</div>'+
      '<div class="student-score">'+score+'</div>';

    const nameInput=document.createElement("input");
    nameInput.type="text";
    nameInput.placeholder="Type name…";
    nameInput.value=name||"";
    nameInput.className="nameInput";
    s.appendChild(nameInput);

    applySize(s);
    scaleTextWithBox(s);

    s.style.position="absolute";
    s.style.left="0px";
    s.style.top="0px";

    return s;
  }

  function makeTemplate(){
    const t=document.createElement("div");
    t.className="tBox";
    t.style.borderColor=col();
    applySize(t);
    t.innerHTML='<div class="student-name"></div><div class="student-score">0</div>';

    t.style.position="absolute";
    main.appendChild(t);

    const sw = spawn.offsetWidth;
    const sh = spawn.offsetHeight;
    const tw = t.offsetWidth;
    const th = t.offsetHeight;

    const spawnRect = spawn.getBoundingClientRect();
    const mainRect = main.getBoundingClientRect();

    const left = (spawnRect.left - mainRect.left) + (sw - tw)/2;
    const top  = (spawnRect.top  - mainRect.top) + (sh - th)/2;

    t.style.left = left + "px";
    t.style.top  = top  + "px";

    const start=e=>{
      if(mode!=="drag")return;
      e.preventDefault();
      const p=e.touches?e.touches[0]:e;
      startDrag(t,p);
    };

    t.onmousedown=start;
    t.ontouchstart=start;
  }

  function spawnTemplate(){
    if(mode==="drag"){
      spawn.innerHTML="";
      makeTemplate();
    }
  }

  function startDrag(el,p){
    if(mode!=="drag")return;

    const mainRect=main.getBoundingClientRect();
    const r=el.getBoundingClientRect();

    drag={
      el,
      ox:p.clientX-r.left,
      oy:p.clientY-r.top,
      mainX:mainRect.left,
      mainY:mainRect.top
    };

    window.addEventListener("mousemove",dragMove,{passive:false});
    window.addEventListener("mouseup",dragEnd,{passive:false});
    window.addEventListener("touchmove",dragMove,{passive:false});
    window.addEventListener("touchend",dragEnd,{passive:false});
  }

  function dragMove(e){
    if(!drag)return;

    const p=e.touches?e.touches[0]:e;

    const el=drag.el;

    let x=p.clientX-drag.ox-drag.mainX;
    let y=p.clientY-drag.oy-drag.mainY;

    const w=el.offsetWidth;
    const h=el.offsetHeight;
    const mw=main.offsetWidth;
    const mh=main.offsetHeight;

    x=Math.max(0,Math.min(mw-w,x));
    y=Math.max(0,Math.min(mh-h,y));

    el.style.left=x+"px";
    el.style.top=y+"px";

    if (drag.el.classList.contains("sBox")) {
      if (isInsideSpawn(drag.el)) {
        spawn.classList.add("deleting");
      } else {
        spawn.classList.remove("deleting");
      }
    }
  }

  function snap(el){
    const r=el.getBoundingClientRect();
    const m=main.getBoundingClientRect();

    let x=r.left-m.left;
    let y=r.top-m.top;

    x=Math.round(x/grid)*grid;
    y=Math.round(y/grid)*grid;

    el.style.left=x+"px";
    el.style.top=y+"px";
  }

  function isInsideSpawn(el){
    const spawnRect = spawn.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();

    const cx = elRect.left + elRect.width/2;
    const cy = elRect.top + elRect.height/2;

    return (
      cx >= spawnRect.left &&
      cx <= spawnRect.right &&
      cy >= spawnRect.top &&
      cy <= spawnRect.bottom
    );
  }

  function dragEnd(){
    if(drag && drag.el){

      if(drag.el.classList.contains("sBox")){
        if(isInsideSpawn(drag.el)){

          spawn.classList.remove("deleting");
          spawn.classList.add("flash");
          setTimeout(() => spawn.classList.remove("flash"), 150);

          drag.el.remove();
          students = students.filter(s => s !== drag.el);
          drag=null;
          return;
        }
      }

      snap(drag.el);
      clampToMain(drag.el);
      scaleTextWithBox(drag.el);

      if(drag.el.classList.contains("tBox")){
        const tRect = drag.el.getBoundingClientRect();
        const mRect = main.getBoundingClientRect();

        const newLeft = tRect.left - mRect.left;
        const newTop  = tRect.top  - mRect.top;

        const s=makeStudent(0,"");
        s.style.left=newLeft+"px";
        s.style.top=newTop+"px";

        clampToMain(s);

        main.appendChild(s);
        students.push(s);
        enableStudent(s);
        scaleTextWithBox(s);

        drag.el.remove();

        requestAnimationFrame(() => {
          spawnTemplate();
        });
      }
    }

    drag=null;
    spawn.classList.remove("deleting");

    window.removeEventListener("mousemove",dragMove);
    window.removeEventListener("mouseup",dragEnd);
    window.removeEventListener("touchmove",dragMove);
    window.removeEventListener("touchend",dragEnd);
  }
  function enableStudent(s){
    const nameSpan=s.querySelector(".student-name");
    const scoreEl=s.querySelector(".student-score");
    const nameInput=s.querySelector(".nameInput");

    nameInput.addEventListener("input",()=>{
      nameSpan.textContent=nameInput.value.trim();
      scaleTextWithBox(s);
    });

    function updateNameMode(){
      if (mode === "names") {
        nameSpan.style.display = "none";
        nameInput.style.display = "block";
      } else {
        nameSpan.style.display = "block";
        nameInput.style.display = "none";
      }
    }

    s.addEventListener("click",()=>{
      if(mode==="point"){
        scoreEl.textContent=parseInt(scoreEl.textContent,10)+1;
        hist.push({t:"one",s});
        scaleTextWithBox(s);
      }
    });

    s.onmousedown=e=>{
      if(mode!=="drag")return;
      const p=e.touches?e.touches[0]:e;
      startDrag(s,p);
    };

    s.ontouchstart=e=>{
      if(mode!=="drag")return;
      const p=e.touches?e.touches[0]:e;
      startDrag(s,p);
    };

    updateNameMode();
  }

  function setMode(m){
    mode=m;
    toggle.textContent=m.toUpperCase();

    spawn.innerHTML="";
    spawn.classList.remove("deleting");

    const existingTemplate=document.querySelector(".tBox");
    if(existingTemplate && m!=="drag"){
      existingTemplate.remove();
    }

    if(m==="drag"){
      toggle.style.background="#5566ff";
      spawnTemplate();
      students.forEach(s=>{
        s.querySelector(".student-name").style.display="block";
        s.querySelector(".nameInput").style.display="none";
      });
    }

    if(m==="point"){
      toggle.style.background="#55aa55";

      const wrap=document.createElement("div");
      wrap.className="pointSplit";

      wrap.style.display="flex";
      wrap.style.flexDirection="row";
      wrap.style.width="100%";
      wrap.style.height="100%";

      const plus=document.createElement("button");
      plus.textContent="ALL +1";
      plus.style.flex="1";
      plus.style.height="100%";
      plus.style.fontSize="22px";
      plus.onclick=()=>{
        students.forEach(s=>{
          const sc=s.querySelector(".student-score");
          sc.textContent=parseInt(sc.textContent,10)+1;
          scaleTextWithBox(s);
        });
        hist.push({t:"all"});
      };

      const undo=document.createElement("button");
      undo.textContent="UNDO";
      undo.style.flex="1";
      undo.style.height="100%";
      undo.style.fontSize="22px";
      undo.onclick=()=>{
        const last=hist.pop();
        if(!last)return;
        if(last.t==="all"){
          students.forEach(s=>{
            const sc=s.querySelector(".student-score");
            sc.textContent=parseInt(sc.textContent,10)-1;
            scaleTextWithBox(s);
          });
        }else if(last.t==="one"){
          const sc=last.s.querySelector(".student-score");
          sc.textContent=parseInt(sc.textContent,10)-1;
          scaleTextWithBox(last.s);
        }
      };

      wrap.appendChild(plus);
      wrap.appendChild(undo);
      spawn.appendChild(wrap);

      students.forEach(s=>{
        s.querySelector(".student-name").style.display="block";
        s.querySelector(".nameInput").style.display="none";
      });
    }

    if(m==="names"){
      toggle.style.background="#aa5555";

      const info=document.createElement("div");
      info.style.textAlign="center";
      info.style.fontSize="18px";
      info.textContent="Edit all names below.";
      spawn.appendChild(info);

      students.forEach(s=>{
        s.querySelector(".student-name").style.display="none";
        s.querySelector(".nameInput").style.display="block";
      });
    }
  }

  sizeSlider.oninput=()=>{
    students.forEach(s=>{
      const oldW = s.offsetWidth;
      const oldH = s.offsetHeight;

      applySize(s);

      const newW = s.offsetWidth;
      const newH = s.offsetHeight;

      const dx = (oldW - newW) / 2;
      const dy = (oldH - newH) / 2;

      let x = parseInt(s.style.left,10) + dx;
      let y = parseInt(s.style.top,10) + dy;

      s.style.left = x + "px";
      s.style.top = y + "px";

      clampToMain(s);
      scaleTextWithBox(s);
    });

    const t=document.querySelector(".tBox");
    if(t && mode==="drag"){
      const oldW = t.offsetWidth;
      const oldH = t.offsetHeight;

      applySize(t);

      const newW = t.offsetWidth;
      const newH = t.offsetHeight;

      const spawnRect = spawn.getBoundingClientRect();
      const mainRect = main.getBoundingClientRect();

      const left = (spawnRect.left - mainRect.left) + (spawn.offsetWidth - newW)/2;
      const top  = (spawnRect.top  - mainRect.top) + (spawn.offsetHeight - newH)/2;

      t.style.left = left + "px";
      t.style.top  = top  + "px";
    }
  };

  resetBtn.onclick=()=>{
    const ok=confirm("Are you sure you want to reset all students?");
    if(!ok)return;

    students.forEach(s=>s.remove());
    students=[];
    hist=[];
  };

  settingsBtn.onclick=()=>{
    settingsMenu.style.display=
      settingsMenu.style.display==="flex" ? "none" : "flex";
  };

  document.addEventListener("click",(e)=>{
    if(!settingsBtn.contains(e.target) &&
       !settingsMenu.contains(e.target)){
      settingsMenu.style.display="none";
    }
  });

  document.getElementById("setLightDark").onclick=()=>{
    document.body.classList.toggle("light");
  };

  function generateCode(){
    const data={
      slider:sizeSlider.value,
      mode,
      hist:hist.map(h=>({t:h.t,index:students.indexOf(h.s)})),
      students:students.map(s=>{
        return{
          x:s.style.left,
          y:s.style.top,
          val:s.querySelector(".student-score").textContent,
          name:s.querySelector(".student-name").textContent,
          color:s.style.borderColor
        };
      })
    };

    const json=JSON.stringify(data);
    let code="PC-";
    for(let i=0;i<json.length;i++){
      code+=json.charCodeAt(i).toString(16).padStart(2,"0");
      if(i%6===5)code+="-";
    }
    return code;
  }

  document.getElementById("setSave").onclick=()=>{
    popupTitle.textContent="Save Code";
    popupCode.textContent=generateCode();
    popup.style.display="flex";
  };

  popupCopy.onclick=()=>{
    navigator.clipboard.writeText(popupCode.textContent);
  };

  popupClose.onclick=()=>{
    popup.style.display="none";
  };

  document.getElementById("setLoad").onclick=()=>{
    const code=prompt("Paste your save code:");
    if(!code)return;

    try{
      const hex=code.replace(/PC-/,"").replace(/-/g,"");
      let json="";
      for(let i=0;i<hex.length;i+=2){
        json+=String.fromCharCode(parseInt(hex.slice(i,i+2),16));
      }
      const data=JSON.parse(json);

      students.forEach(s=>s.remove());
      students=[];
      hist=[];

      sizeSlider.value=data.slider;
      setMode(data.mode);

      data.students.forEach(st=>{
        const s=makeStudent(st.val,st.name);
        s.style.borderColor=st.color;
        applySize(s);
        s.style.left=st.x;
        s.style.top=st.y;

        clampToMain(s);

        main.appendChild(s);
        students.push(s);
        enableStudent(s);
        scaleTextWithBox(s);
      });

      hist=[];
      data.hist.forEach(h=>{
        if(h.index>=0 && students[h.index]){
          hist.push({t:h.t,s:students[h.index]});
        }
      });

    }catch(e){
      alert("Invalid code.");
    }
  };

  document.getElementById("setExport").onclick=()=>{
    const rows=students.map(s=>{
      return{
        name:s.querySelector(".student-name").textContent,
        score:parseInt(s.querySelector(".student-score").textContent,10)
      };
    });

    const alpha=rows.filter(r=>/^[A-Za-z]/.test(r.name));
    const nonAlpha=rows.filter(r=>!/^[A-Za-z]/.test(r.name));

    alpha.sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    nonAlpha.sort((a,b)=>b.score-a.score);

    const ordered=alpha.concat(nonAlpha);

    let csv="Name,Score\n";
    ordered.forEach(r=>{
      csv+='"'+r.name.replace(/"/g,'""')+'",'+r.score+"\n";
    });

    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="points.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  toggle.onclick = () => {
    if (mode === "drag") {
      setMode("point");
    } else if (mode === "point") {
      setMode("names");
    } else {
      setMode("drag");
    }
  };

  setMode("drag");

})();

</script>
